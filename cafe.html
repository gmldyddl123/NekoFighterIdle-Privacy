<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'sha256-9V8bVFP/LQ4oJMuvIO9xCPm1FwV8vF0ehU5HnKF3Jjw='; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'; object-src 'none'">
  <title>냥투가키우기 공식 카페</title>
  <style>
    :root {
      color-scheme: light;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    body {
      display: grid;
      min-height: 100vh;
      margin: 0;
      place-items: center;
      background: #f6f7f9;
      color: #202124;
      text-align: center;
    }
    main {
      max-width: 24rem;
      padding: 2rem;
    }
    a {
      display: inline-block;
      margin-top: 1rem;
      padding: 0.8rem 1.2rem;
      border-radius: 0.6rem;
      background: #03c75a;
      color: #fff;
      font-weight: 700;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <main>
    <h1>냥투가키우기 공식 카페</h1>
    <p>네이버 카페 앱을 열 수 없으면 웹 카페로 이동합니다.</p>
    <a href="https://cafe.naver.com/nekofighteridle">웹으로 바로 열기</a>
  </main>
  <script>(() => {
  "use strict";

  const webUrl = "https://cafe.naver.com/nekofighteridle";
  const callerUrl = encodeURIComponent(window.location.origin + window.location.pathname);
  const appUrl =
    "navercafe://cafe?cafeUrl=nekofighteridle&appId=" + callerUrl;
  const androidIntentUrl =
    "intent://cafe?cafeUrl=nekofighteridle&appId=" + callerUrl +
    "#Intent;scheme=navercafe;action=android.intent.action.VIEW;" +
    "category=android.intent.category.BROWSABLE;" +
    "package=com.nhn.android.navercafe;" +
    "S.browser_fallback_url=" + encodeURIComponent(webUrl) + ";end";

  let fallbackTimer = 0;

  const openWeb = () => {
    window.location.replace(webUrl);
  };

  const cancelFallback = () => {
    if (fallbackTimer !== 0) {
      window.clearTimeout(fallbackTimer);
      fallbackTimer = 0;
    }
  };

  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "hidden") {
      cancelFallback();
    }
  });
  window.addEventListener("pagehide", cancelFallback);

  const userAgent = navigator.userAgent || "";
  const isAndroid = /Android/i.test(userAgent);
  const isIOS = /iPhone|iPad|iPod/i.test(userAgent);

  if (!isAndroid && !isIOS) {
    openWeb();
    return;
  }

  fallbackTimer = window.setTimeout(openWeb, 1800);
  window.location.href = isAndroid ? androidIntentUrl : appUrl;
})();</script>
</body>
</html>
