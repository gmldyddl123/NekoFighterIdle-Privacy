<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'sha256-KPBuVrIFlPpXDz8FwNC2MxQoZyyumX+xJEWa20BYLpA='; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'; object-src 'none'">
  <title>냥투가키우기 공식 카페</title>
  <style>
    :root {
      color-scheme: light;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    body {
      display: grid;
      min-height: 100vh;
      margin: 0;
      place-items: center;
      background: #f6f7f9;
      color: #202124;
      text-align: center;
    }
    main {
      width: min(24rem, calc(100% - 3rem));
      padding: 2rem 0;
    }
    .button {
      display: block;
      margin-top: 0.8rem;
      padding: 0.9rem 1.2rem;
      border: 1px solid #03c75a;
      border-radius: 0.6rem;
      font-weight: 700;
      text-decoration: none;
      touch-action: manipulation;
    }
    .primary {
      margin-top: 1.5rem;
      background: #03c75a;
      color: #fff;
    }
    .secondary {
      background: #fff;
      color: #027a38;
    }
    .hint {
      margin-top: 1.25rem;
      color: #5f6368;
      font-size: 0.9rem;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <main>
    <h1>냥투가키우기 공식 카페</h1>
    <p>아래 버튼을 눌러 네이버 카페 앱으로 이동하세요.</p>
    <a id="app-link"
       class="button primary"
       href="navercafe://cafe?cafeUrl=nekofighteridle&amp;appId=https%3A%2F%2Fgmldyddl123.github.io%2FNekoFighterIdle-Privacy%2Fcafe.html">네이버 카페 앱으로 열기</a>
    <a class="button secondary"
       href="https://cafe.naver.com/nekofighteridle">웹으로 열기</a>
    <p class="hint">카페 앱이 설치되어 있지 않으면 웹 카페로 이동합니다.</p>
  </main>
  <script>(() => {
  "use strict";

  const webUrl = "https://cafe.naver.com/nekofighteridle";
  const callerUrl = encodeURIComponent(window.location.origin + window.location.pathname);
  const appUrl =
    "navercafe://cafe?cafeUrl=nekofighteridle&appId=" + callerUrl;
  const androidIntentUrl =
    "intent://cafe?cafeUrl=nekofighteridle&appId=" + callerUrl +
    "#Intent;scheme=navercafe;action=android.intent.action.VIEW;" +
    "category=android.intent.category.BROWSABLE;" +
    "package=com.nhn.android.navercafe;" +
    "S.browser_fallback_url=" + encodeURIComponent(webUrl) + ";end";
  const appLink = document.getElementById("app-link");
  const userAgent = navigator.userAgent || "";
  const isIOS =
    /iPhone|iPad|iPod/i.test(userAgent) ||
    (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  let fallbackTimer = 0;

  const cancelFallback = () => {
    if (fallbackTimer !== 0) {
      window.clearTimeout(fallbackTimer);
      fallbackTimer = 0;
    }
  };

  const openWeb = () => {
    if (document.visibilityState === "visible") {
      window.location.replace(webUrl);
    }
  };

  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "hidden") {
      cancelFallback();
    }
  });
  window.addEventListener("pagehide", cancelFallback);

  if (isIOS) {
    appLink.href = appUrl;
    appLink.addEventListener("click", () => {
      cancelFallback();
      fallbackTimer = window.setTimeout(openWeb, 1800);
    });
    return;
  }

  appLink.href = androidIntentUrl;
})();</script>
</body>
</html>
